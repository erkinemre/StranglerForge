<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42637f"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#102238"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><path d="M60 126 H1540" stroke="#304b66" stroke-width="2"/><text x="68" y="70" fill="#4fd8e9" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">FIGURE 08  /  STRANGLERFORGE</text><text x="68" y="112" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="39" font-weight="700" text-anchor="start">Read canaries do not transfer write ownership</text><text x="68" y="161" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start">Post-cutover, legacy SQL is not an automatic fallback</text><g><rect x="80" y="270" width="290" height="105" rx="18" fill="#132338" stroke="#4fd8e9" stroke-width="2"/><rect x="82" y="272" width="6" height="101" rx="3" fill="#4fd8e9"/><text x="102" y="308" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Gateway flags</text><text x="102" y="339" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Pre-cutover Catalog only</text></g><g><rect x="540" y="215" width="300" height="100" rx="18" fill="#132338" stroke="#75aaff" stroke-width="2"/><rect x="542" y="217" width="6" height="96" rx="3" fill="#75aaff"/><text x="562" y="253" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Modern read</text><text x="562" y="284" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Deterministic percentage</text></g><g><rect x="540" y="395" width="300" height="100" rx="18" fill="#132338" stroke="#e8ad63" stroke-width="2"/><rect x="542" y="397" width="6" height="96" rx="3" fill="#e8ad63"/><text x="562" y="433" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Legacy read</text><text x="562" y="464" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Only while authoritative</text></g><g><rect x="1050" y="280" width="430" height="115" rx="18" fill="#132338" stroke="#83d7af" stroke-width="2"/><rect x="1052" y="282" width="6" height="111" rx="3" fill="#83d7af"/><text x="1072" y="318" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Write guard</text><text x="1072" y="349" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">One owner and compatible stage</text></g><path d="M370 318 L540 265" fill="none" stroke="#42637f" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="279.5" fill="#42637f" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle">canary GET</text><path d="M370 335 L540 445" fill="none" stroke="#e8ad63" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="378" fill="#e8ad63" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle">safe legacy GET</text><path d="M840 265 L1050 330" fill="none" stroke="#42637f" stroke-width="3" marker-end="url(#arrow)"/><text x="945" y="285.5" fill="#42637f" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle">compare contract</text><path d="M840 445 L1050 350" fill="none" stroke="#42637f" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="600" width="416" height="34" rx="17" fill="#f09798" fill-opacity=".14" stroke="#f09798" stroke-opacity=".65"/><text x="163" y="623" fill="#f09798" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="start">Rollback = reconciliation + eligibility</text><rect x="840" y="600" width="366" height="34" rx="17" fill="#f09798" fill-opacity=".14" stroke="#f09798" stroke-opacity=".65"/><text x="853" y="623" fill="#f09798" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="start">route switch alone is insufficient</text><path d="M60 840 H1540" stroke="#304b66" stroke-width="2"/><text x="68" y="870" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="600" text-anchor="start">REFERENCE IMPLEMENTATION · NOT A PRODUCTION PERFORMANCE MEASUREMENT</text></svg>