<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42637f"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#102238"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><path d="M60 126 H1540" stroke="#304b66" stroke-width="2"/><text x="68" y="70" fill="#4fd8e9" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">FIGURE 02  /  STRANGLERFORGE</text><text x="68" y="112" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="39" font-weight="700" text-anchor="start">Migration was a sequence of ownership changes</text><text x="68" y="161" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start">Implementation milestones, not throughput or delivery-time measurements</text><g><rect x="100" y="265" width="245" height="145" rx="18" fill="#132338" stroke="#e8ad63" stroke-width="2"/><rect x="102" y="267" width="6" height="141" rx="3" fill="#e8ad63"/><text x="122" y="303" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">01–02  Modular monolith</text><text x="122" y="334" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">SQL Server</text></g><g><rect x="405" y="265" width="245" height="145" rx="18" fill="#132338" stroke="#e8ad63" stroke-width="2"/><rect x="407" y="267" width="6" height="141" rx="3" fill="#e8ad63"/><text x="427" y="303" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">03  YARP boundary</text><text x="427" y="334" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Legacy routes</text></g><g><re