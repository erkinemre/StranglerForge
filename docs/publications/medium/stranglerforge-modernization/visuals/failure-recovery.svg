<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42637f"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#102238"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><path d="M60 126 H1540" stroke="#304b66" stroke-width="2"/><text x="68" y="70" fill="#4fd8e9" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">FIGURE 07  /  STRANGLERFORGE</text><text x="68" y="112" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="39" font-weight="700" text-anchor="start">A payment failure changes the recovery path</text><text x="68" y="161" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start">Definite rejection compensates; an ambiguous result remains pending</text><g><rect x="90" y="260" width="290" height="115" rx="18" fill="#132338" stroke="#75aaff" stroke-width="2"/><rect x="92" y="262" width="6" height="111" rx="3" fill="#75aaff"/><text x="112" y="298" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Stock reserved</text><text x="112" y="329" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Reservation keyed by order</text></g><g><rect x="555" y="260" width="290" height="115" rx="18" fill="#132338" stroke="#e8ad63" stroke-width="2"/><rect x="557" y="262" width="6" height="111" rx="3" fill="#e8ad63"/><text x="577" y="298" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Payment attempt</text><text x="577" y="329" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Legacy simulated provider</text></g><g><rect x="1010" y="175" width="365" height="100" rx="18" fill="#132338" stroke="#83d7af" stroke-width="2"/><rect x="1012" y="177" width="6" height="96" rx="3" fill="#83d7af"/><text x="1032" y="213" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Authorized</text><text x="1032" y="244" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Confirm stock; notify</text></g><g><rect x="1010" y="365" width="365" height="100" rx="18" fill="#132338" stroke="#e8ad63" stroke-width="2"/><rect x="1012" y="367" width="6" height="96" rx="3" fill="#e8ad63"/><text x="1032" y="403" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Rejected</text><text x="1032" y="434" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Release stock; notify</text></g><g><rect x="1010" y="555" width="365" height="100" rx="18" fill="#132338" stroke="#f09798" stroke-width="2"/><rect x="1012" y="557" width="6" height="96" rx="3" fill="#f09798"/><text x="1032" y="593" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Unknown outcome</text><text x="1032" y="624" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Retain pending state; inspect</text></g><path d="M380 318 L555 318" fill="none" stroke="#42637f" stroke-width="3" marker-end="url(#arrow)"/><path d="M845 300 L1010 225" fill="none" stroke="#83d7af" stroke-width="3" marker-end="url(#arrow)"/><text x="927.5" y="250.5" fill="#83d7af" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle">definite success</text><path d="M845 318 L1010 415" fill="none" stroke="#e8ad63" stroke-width="3" marker-end="url(#arrow)"/><text x="927.5" y="354.5" fill="#e8ad63" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle">definite failure</text><path d="M845 340 L1010 605" fill="none" stroke="#f09798" stroke-width="3" marker-end="url(#arrow)"/><text x="927.5" y="460.5" fill="#f09798" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="600" text-anchor="middle">timeout / ambiguity</text><rect x="155" y="545" width="376" height="34" rx="17" fill="#f09798" fill-opacity=".14" stroke="#f09798" stroke-opacity=".65"/><text x="168" y="568" fill="#f09798" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="start">Do not infer rejection from timeout</text><path d="M60 840 H1540" stroke="#304b66" stroke-width="2"/><text x="68" y="870" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="600" text-anchor="start">REFERENCE IMPLEMENTATION · NOT A PRODUCTION PERFORMANCE MEASUREMENT</text></svg>