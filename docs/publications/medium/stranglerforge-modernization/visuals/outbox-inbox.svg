<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42637f"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#102238"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><path d="M60 126 H1540" stroke="#304b66" stroke-width="2"/><text x="68" y="70" fill="#4fd8e9" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="start">FIGURE 05  /  STRANGLERFORGE</text><text x="68" y="112" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="39" font-weight="700" text-anchor="start">The transaction includes the message intent</text><text x="68" y="161" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start">Delivery is at least once; the consumer must be idempotent</text><g><rect x="75" y="320" width="270" height="110" rx="18" fill="#132338" stroke="#75aaff" stroke-width="2"/><rect x="77" y="322" width="6" height="106" rx="3" fill="#75aaff"/><text x="97" y="358" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">Business command</text><text x="97" y="389" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Reserve or transition</text></g><g><rect x="480" y="240" width="340" height="105" fill="#172b43" stroke="#4fd8e9" stroke-width="2"/><ellipse cx="650" cy="240" rx="170" ry="15" fill="#172b43" stroke="#4fd8e9" stroke-width="2"/><path d="M480 345 A170 15 0 0 0 820 345" fill="none" stroke="#4fd8e9" stroke-width="2"/><text x="650" y="278" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Business rows</text><text x="650" y="303" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Same PostgreSQL commit</text></g><g><rect x="480" y="470" width="340" height="105" fill="#172b43" stroke="#4fd8e9" stroke-width="2"/><ellipse cx="650" cy="470" rx="170" ry="15" fill="#172b43" stroke="#4fd8e9" stroke-width="2"/><path d="M480 575 A170 15 0 0 0 820 575" fill="none" stroke="#4fd8e9" stroke-width="2"/><text x="650" y="508" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle">OutboxMessage</text><text x="650" y="533" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Same PostgreSQL commit</text></g><g><rect x="965" y="335" width="250" height="110" rx="18" fill="#132338" stroke="#75aaff" stroke-width="2"/><rect x="967" y="337" width="6" height="106" rx="3" fill="#75aaff"/><text x="987" y="373" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">RabbitMQ</text><text x="987" y="404" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">Retryable delivery</text></g><g><rect x="1320" y="350" width="230" height="80" fill="#172b43" stroke="#83d7af" stroke-width="2"/><ellipse cx="1435" cy="350" rx="115" ry="15" fill="#172b43" stroke="#83d7af" stroke-width="2"/><path d="M1320 430 A115 15 0 0 0 1550 430" fill="none" stroke="#83d7af" stroke-width="2"/><text x="1435" y="388" fill="#f2f7ff" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Inbox + audit</text><text x="1435" y="413" fill="#a9bdd3" font-family="Arial,Segoe UI,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Deduplicate by ID</text></g><path d="M345 375 L480 292" fill="none" stroke="#42637f" stroke-width="3" marker-end="url(#arrow)"/><path d="M345 375 L480 522" fill="none" stroke="#42637f" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 522 L965 390" fill="