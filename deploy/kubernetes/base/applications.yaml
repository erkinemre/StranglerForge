apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  ReverseProxy__Clusters__legacy__Destinations__monolith__Address: http://legacy:8080/
  ReverseProxy__Clusters__catalog__Destinations__service__Address: http://catalog:8080/
  ReverseProxy__Clusters__inventory__Destinations__service__Address: http://inventory:8080/
  ReverseProxy__Clusters__orders__Destinations__service__Address: http://orders:8080/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/erkinemre/stranglerforge-gateway:REPLACE_WITH_IMMUTABLE_DIGEST
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
          - name: ASPNETCORE_URLS
            value: http://+:8080
          - name: OTEL_SERVICE_NAME
            value: stranglerforge-gateway
        envFrom:
          - configMapRef:
              name: gateway-config
          - secretRef:
              name: gateway-secrets
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 1000m, memory: 512Mi }
        startupProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet: { path: /health/live, port: http }
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health/ready, port: http }
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
  - name: http
    port: 8080
    targetPort: http
---
