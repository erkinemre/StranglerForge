name: CI

on:
  push:
  pull_request:

jobs:
  build-and-gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore StranglerForge.slnx
      - name: Build
        run: dotnet build StranglerForge.slnx --no-restore
      - name: Gateway tests
        run: dotnet test tests/IntegrationTests/StranglerForge.GatewayTests/StranglerForge.GatewayTests.csproj --no-restore
